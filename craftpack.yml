name: craftpack
description: Standardized Linux packaging factory for the Software Delivery Platform
extended_description: |
  Craftpack provides reproducible and automated packaging pipelines for Linux
  distributions. It reads a declarative craftpack.yml specification and packages
  payload binaries, manual pages, default configurations, lifecycle hooks,
  machine-readable DEP-5 copyright files, and policy-compliant changelogs into
  Debian (.deb) binary archives.
maintainer: Marcin Kaim <9829098+marcinkaim@users.noreply.github.com>
homepage: https://github.com/konstrux/craftpack
license: GPL-3.0-only

command: craftpack
payload_dir: dist/payload
entrypoint: bin/craftpack

man_pages:
  - source: docs/manuals/craftpack.1.md
    section: 1
    title: CRAFTPACK
    header: User Commands Manual
    footer: Craftpack Packaging Utility
  - source: docs/manuals/craftpack.yml.5.md
    section: 5
    name: craftpack.yml
    title: CRAFTPACK.YML
    header: File Formats Manual
    footer: Craftpack Packaging Specification

templates_dir: templates

targets:
  deb:
    section: utils
    priority: optional
    wrapper: false
    dependencies:
      - libc6 (>= 2.31)
