name: craftpack
description: Standardized Linux packaging factory for the Software Delivery Platform
maintainer: Marcin Kaim <9829098+marcinkaim@users.noreply.github.com>
homepage: https://github.com/konstrux/craftpack
license: GPL-3.0-only

command: craftpack
payload_dir: dist/payload
entrypoint: bin/craftpack

man_pages:
  - source: docs/manuals/craftpack.1.md
    section: 1
    title: CRAFTPACK
    header: User Commands Manual
    footer: Craftpack Packaging Utility
  - source: docs/manuals/craftpack.yml.5.md
    section: 5
    name: craftpack.yml
    title: CRAFTPACK.YML
    header: File Formats Manual
    footer: Craftpack Packaging Specification

default_config:
  config/craftpack.default.yml: craftpack.yml

targets:
  deb:
    section: utils
    priority: optional
    wrapper: false
    dependencies:
      - libc6 (>= 2.31)
