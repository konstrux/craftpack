# ==============================================================================
# Craftpack Packaging Specification Template
# ==============================================================================
# This template describes the configuration manifest (craftpack.yml) used by
# the Craftpack packaging engine to bundle applications into system packages.
#
# For full documentation, refer to craftpack(1) manual page or online repository:
# https://github.com/marcinkaim/craftpack
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Package Metadata (Mandatory)
# ------------------------------------------------------------------------------

# Package identity name. Must consist of lowercase alphanumeric characters and
# single hyphens, starting and ending with an alphanumeric character.
name: craftpack

# Brief, single-line synopsis describing the package (plain text, 10-150 chars).
description: Standardized Linux packaging factory for the Software Delivery Platform

# Maintainer contact details in standard RFC 822 format: "Name <email@domain.tld>".
maintainer: Marcin Kaim <9829098+marcinkaim@users.noreply.github.com>

# Project homepage or repository URL (must use http:// or https:// scheme).
homepage: https://github.com/marcinkaim/craftpack

# Software license identifier conforming to the SPDX license index (e.g. Apache-2.0, MIT).
license: Apache-2.0

# ------------------------------------------------------------------------------
# 2. Core Application Properties (Mandatory)
# ------------------------------------------------------------------------------

# Public command alias. When wrapper is false (default), the entrypoint binary
# is placed directly at /usr/bin/<command>. When wrapper is true, Craftpack generates
# a transparent POSIX shell wrapper at /usr/bin/<command> that delegates execution
# via exec to /usr/lib/<name>/<entrypoint>.
command: craftpack

# Relative workspace directory containing pre-compiled binaries, assets, or libraries.
# In direct binary mode (wrapper=false), the entrypoint is placed directly at /usr/bin/<command>
# and auxiliary files are staged under /usr/lib/<name>/. In wrapper mode (wrapper=true),
# all files are staged under /usr/lib/<name>/ to preserve FHS compliance.
payload_dir: dist/payload

# Path to the primary executable binary relative to payload_dir.
entrypoint: bin/craftpack

# ------------------------------------------------------------------------------
# 3. Documentation & Manual Pages (Optional)
# ------------------------------------------------------------------------------
# Markdown files compiled on-the-fly into compressed roff manual pages and installed
# to /usr/share/man/man[1-8]/<command>.[1-8].gz. Zero-Markup policy applies.
man_pages:
  - source: docs/manual.md
    section: 1
    title: CRAFTPACK
    header: User Commands Manual
    footer: Craftpack Packaging Utility

# ------------------------------------------------------------------------------
# 4. Default Configuration Files (Optional)
# ------------------------------------------------------------------------------
# Mapping of workspace source templates to configuration filenames installed into
# /etc/<name>/. Registered in package control indices (conffiles) to protect
# user modifications during upgrades.
default_config:
  config/craftpack.default.yml: craftpack.yml

# ------------------------------------------------------------------------------
# 5. Universal Lifecycle Hooks (Optional)
# ------------------------------------------------------------------------------
# POSIX /bin/sh script snippets executed during installation and removal stages.
# Destructive commands (e.g. rm -rf /) are strictly forbidden by security validators.
# preinstall: scripts/preinst.sh
# postinstall: scripts/postinst.sh
# preremove: scripts/prerm.sh
# postremove: scripts/postrm.sh

# ------------------------------------------------------------------------------
# 6. Target-Specific Configurations (Mandatory)
# ------------------------------------------------------------------------------
targets:
  deb:
    # Debian archive section (e.g. utils, devel, net, admin, misc).
    section: utils

    # Debian package priority (optional, required, important, standard, extra).
    priority: optional

    # Package wrapper mode. Defaults to false (direct binary placement in /usr/bin/<command>).
    # Set to true to isolate payload in /usr/lib/<name>/ and generate a proxy shell script at /usr/bin/<command>.
    wrapper: false

    # Package runtime dependencies with optional version comparison constraints.
    dependencies:
      - libc6 (>= 2.31)
