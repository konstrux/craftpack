name: Release Craftpack

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # 1. Compile and unit-test the new version N
      - name: Build & Test Binary (N)
        run: |
          go test ./...
          mkdir -p dist/payload/bin
          go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/payload/bin/craftpack ./cmd/craftpack

      # 2. Self-Package: version N packages itself into the target container
      - name: Self-Package
        run: |
          ./dist/payload/bin/craftpack build \
            --spec craftpack.yml \
            --package-version "${{ github.ref_name }}" \
            --target deb \
            --output-dir ./dist

      # 3. Attest Build Provenance (SLSA v1.0 via Sigstore)
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.deb'

      # 4. Publish the completed package and checksum manifest
      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/checksums.sha256 \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
